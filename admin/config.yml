# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  base_url: https://sveltia-cms-auth.ozi.workers.dev
  repo: ozipoetra/astro-blog
  branch: dev/shakib
  commit_messages:
    create: Create {{collection}} "{{slug}}"
    update: Update {{collection}} "{{slug}}"
    delete: Delete {{collection}} "{{slug}}"
    uploadMedia: Upload "{{path}}"
    deleteMedia: Delete "{{path}}"

# Where uploads go (repo-relative). public_folder is the prefix written into frontmatter.
# Content uses '@/assets/media/...' so CMS must write the same format for Astro image() to resolve.
media_folder: src/assets/media
public_folder: '@/assets/media'

media_libraries:
  all:
    max_file_size: 5120000

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: '-'
  trim: true
  lowercase: true

i18n:
  structure: multiple_folders
  locales: [en, id, zh-CN, ru]
  default_locale: en

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    icon: article
    folder: src/content/blog
    extension: md
    format: frontmatter
    create: true
    preview_path: /{{locale}}/blog/{{slug}}
    summary: '{{title}}'
    sortable_fields: ['title', 'pubDate']
    i18n: true
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: description
        label: Description
        widget: text
        i18n: true
      - name: pubDate
        label: Publish Date
        widget: datetime
        i18n: duplicate
      - name: updatedDate
        label: Updated Date
        widget: datetime
        i18n: duplicate
        required: false
      - name: heroImage
        label: Hero Image
        widget: image
        i18n: duplicate
        required: false
      - name: category
        label: Category
        widget: select
        i18n: duplicate
        required: false
        options:
          - tutorial
          - opinion
          - news
          - update
          - review
      - name: tags
        label: Tags
        widget: list
        i18n: duplicate
        allow_add: true
      - name: body
        label: Body
        widget: markdown
        i18n: true

  - name: services
    label: Services
    label_singular: Service
    icon: home_repair_service
    folder: src/content/services
    extension: md
    format: frontmatter
    create: true
    preview_path: /{{locale}}/services/{{slug}}
    summary: '{{title}}'
    sortable_fields: ['title', 'order']
    i18n: true
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: description
        label: Short Description
        widget: text
        i18n: true
      - name: category
        label: Category
        widget: select
        i18n: duplicate
        options:
          - phone-repair
          - web-dev
        default: phone-repair
      - name: icon
        label: Icon
        widget: select
        i18n: duplicate
        default: smartphone
        options:
          - smartphone
          - cpu
          - download
          - zap
          - unlock
          - rocket
          - layout
          - code
          - tablet
      - name: brands
        label: Brands
        widget: select
        i18n: duplicate
        multiple: true
        required: false
        options:
          - xiaomi
          - redmi
          - poco
          - infinix
          - tecno
          - itel
          - oneplus
          - oppo
          - realme
          - samsung
          - vivo
          - iqoo
      - name: symptoms
        label: Symptoms (phone-repair)
        widget: list
        i18n: duplicate
        required: false
        allow_add: true
      - name: technologies
        label: Technologies (web-dev)
        widget: list
        i18n: duplicate
        required: false
        allow_add: true
      - name: price_from
        label: Price From
        widget: number
        i18n: duplicate
        default: 0
        min: 0
      - name: price_unit
        label: Currency
        widget: select
        i18n: duplicate
        default: IDR
        options:
          - IDR
          - USD
      - name: duration
        label: Duration
        widget: string
        i18n: duplicate
        default: 30–90 min
      - name: remote
        label: Remote Available
        widget: boolean
        i18n: duplicate
        default: true
      - name: requirements
        label: Requirements
        widget: list
        i18n: duplicate
        required: false
        allow_add: true
      - name: deliverables
        label: Deliverables
        widget: list
        i18n: duplicate
        required: false
        allow_add: true
      - name: featured
        label: Featured on Homepage
        widget: boolean
        i18n: duplicate
        default: false
      - name: order
        label: Sort Order
        widget: number
        i18n: duplicate
        default: 0
      - name: heroImage
        label: Hero Image
        widget: image
        i18n: duplicate
        required: false
      - name: body
        label: Body
        widget: markdown
        i18n: true

  - name: projects
    label: Projects
    label_singular: Project
    icon: code
    folder: src/content/projects
    extension: md
    format: frontmatter
    create: true
    preview_path: /{{locale}}/projects/{{slug}}
    summary: '{{title}}'
    i18n: true
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: description
        label: Description
        widget: text
        i18n: true
      - name: icon
        label: Icon
        widget: string
        i18n: false
        default: 🚀
      - name: technologies
        label: Technologies
        widget: list
        i18n: false
        allow_add: true
      - name: github
        label: GitHub URL
        widget: string
        i18n: false
        required: false
      - name: demo
        label: Demo URL
        widget: string
        i18n: false
        required: false
      - name: heroImage
        label: Hero Image
        widget: image
        i18n: false
        required: false
      - name: featured
        label: Featured
        widget: boolean
        i18n: false
        default: false
      - name: order
        label: Sort Order
        widget: number
        i18n: false
        default: 0
      - name: body
        label: Body
        widget: markdown
        i18n: true

  - name: pages
    label: Pages
    label_singular: Page
    icon: description
    folder: src/content/pages
    extension: md
    format: frontmatter
    create: true
    summary: '{{title}}'
    i18n: true
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: description
        label: Description
        widget: text
        i18n: true
      - name: layout
        label: Layout
        widget: select
        i18n: false
        options:
          - hero
          - content
          - sidebar
        default: content
      - name: heroImage
        label: Hero Image
        widget: image
        i18n: false
        required: false
      - name: body
        label: Body
        widget: markdown
        i18n: true

  - divider: true

  - name: settings
    label: Site Settings
    icon: settings
    files:
      - name: site
        label: Site & Navbar
        file: src/content/settings/settings.yml
        fields:
          - name: site_title
            label: Site Title
            widget: string
          - name: site_tagline
            label: Site Tagline
            widget: string
          - name: site_description
            label: Site Description
            widget: text
          - name: navbar_items
            label: Navigation Links
            widget: list
            fields:
              - name: key
                label: Translation Key
                widget: string
              - name: path
                label: Path
                widget: string
          - name: navbar_show_search
            label: Show Search
            widget: boolean
            default: true
          - name: navbar_show_contact
            label: Show Contact Button
            widget: boolean
            default: true
      - name: profile
        label: Profile
        file: src/content/settings/profile.yml
        fields:
          - name: profile_name
            label: Display Name
            widget: string
          - name: profile_username
            label: Username
            widget: string
          - name: profile_bio
            label: Bio
            widget: text
          - name: profile_picture
            label: Profile Picture
            widget: image
            required: false
          - name: profile_github
            label: GitHub URL
            widget: string
            required: false
          - name: profile_twitter
            label: Twitter/X URL
            widget: string
            required: false
          - name: profile_linkedin
            label: LinkedIn URL
            widget: string
            required: false
          - name: profile_email
            label: Email
            widget: string
            required: false
          - name: profile_whatsapp
            label: WhatsApp Number
            widget: string
            required: false
          - name: profile_telegram
            label: Telegram URL
            widget: string
            required: false
          - name: profile_location
            label: Location
            widget: string
            required: false
          - name: profile_website
            label: Website
            widget: string
            required: false
      - name: i18n
        label: Languages
        file: src/content/settings/i18n.yml
        fields:
          - name: default_locale
            label: Default Language
            widget: select
            options:
              - en
              - id
              - zh-CN
              - ru
          - name: locales
            label: Languages
            widget: list
            allow_add: false
            fields:
              - name: code
                label: Language Code
                widget: string
              - name: name
                label: Language Name
                widget: string
              - name: label
                label: Short Label
                widget: string
              - name: enabled
                label: Enabled
                widget: boolean
                default: true
      - name: translations_en
        label: English Translations
        file: src/i18n/en.json
        format: json
        fields:
          - name: translations
            label: Translations
            widget: keyvalue
            root: true
            key_label: Key
            value_label: Value
      - name: translations_id
        label: Bahasa Indonesia Translations
        file: src/i18n/id.json
        format: json
        fields:
          - name: translations
            label: Translations
            widget: keyvalue
            root: true
            key_label: Key
            value_label: Value
      - name: translations_zhcn
        label: 简体中文 Translations
        file: src/i18n/zh-CN.json
        format: json
        fields:
          - name: translations
            label: Translations
            widget: keyvalue
            root: true
            key_label: Key
            value_label: Value
      - name: translations_ru
        label: Русский Translations
        file: src/i18n/ru.json
        format: json
        fields:
          - name: translations
            label: Translations
            widget: keyvalue
            root: true
            key_label: Key
            value_label: Value
