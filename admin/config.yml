# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  base_url: https://sveltia-cms-auth.ozi.workers.dev
  repo: ozipoetra/astro-blog
  branch: main
  commit_messages:
    create: Create {{collection}} "{{slug}}"
    update: Update {{collection}} "{{slug}}"
    delete: Delete {{collection}} "{{slug}}"
    uploadMedia: Upload "{{path}}"
    deleteMedia: Delete "{{path}}"

media_folder: "/src/assets/media"
public_folder: "@/assets/media"

i18n:
  structure: multiple_folders
  locales: [en, id, zh-CN, ru]
  default_locale: en

collections:
  - name: blog
    label: Blog Posts
    folder: src/content/blog
    preview_path: "/{{locale}}/blog/{{slug}}"
    i18n: true
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: description
        label: Description
        widget: text
        i18n: true
      - name: pubDate
        label: Publish Date
        widget: datetime
        i18n: duplicate
      - name: updatedDate
        label: Updated Date
        widget: datetime
        i18n: duplicate
        required: false
      - name: heroImage
        label: Hero Image
        widget: image
        i18n: duplicate
        required: false
      - name: category
        label: Category
        widget: select
        i18n: duplicate
        required: false
        options:
          - tutorial
          - opinion
          - news
          - update
          - review
      - name: tags
        label: Tags
        widget: list
        i18n: duplicate
      - name: body
        label: Body
        widget: markdown
        i18n: true

  - name: projects
    label: Projects
    folder: src/content/projects
    preview_path: "/{{locale}}/projects/{{slug}}"
    i18n: true
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: description
        label: Description
        widget: text
        i18n: true
      - name: icon
        label: Icon
        widget: string
        i18n: false
        default: "🚀"
      - name: technologies
        label: Technologies
        widget: list
        i18n: false
        allow_add: true
      - name: github
        label: GitHub URL
        widget: string
        i18n: false
        required: false
      - name: demo
        label: Demo URL
        widget: string
        i18n: false
        required: false
      - name: heroImage
        label: Hero Image
        widget: image
        i18n: false
        required: false
      - name: featured
        label: Featured
        widget: boolean
        i18n: false
        default: false
      - name: order
        label: Sort Order
        widget: number
        i18n: false
        default: 0
      - name: body
        label: Body
        widget: markdown
        i18n: true

  - name: pages
    label: Pages
    folder: src/content/pages
    i18n: true
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: description
        label: Description
        widget: text
        i18n: true
      - name: layout
        label: Layout
        widget: select
        i18n: false
        options:
          - hero
          - content
          - sidebar
        default: content
      - name: heroImage
        label: Hero Image
        widget: image
        i18n: false
        required: false
      - name: body
        label: Body
        widget: markdown
        i18n: true

  - name: settings
    label: Site Settings
    files:
      - name: site
        label: Site
        file: src/content/settings/general.yml
        fields:
          - name: site_title
            label: Site Title
            widget: string
          - name: site_tagline
            label: Site Tagline
            widget: string
          - name: site_description
            label: Site Description
            widget: text
      - name: navbar
        label: Navbar
        file: src/content/settings/general.yml
        fields:
          - name: navbar_items
            label: Navigation Links
            widget: list
            fields:
              - name: label
                label: Label
                widget: string
              - name: path
                label: Path
                widget: string
          - name: navbar_show_search
            label: Show Search
            widget: boolean
            default: true
          - name: navbar_show_contact
            label: Show Contact Button
            widget: boolean
            default: true
          - name: navbar_contact_text
            label: Contact Button Text
            widget: string
      - name: profile
        label: Profile
        file: src/content/settings/general.yml
        fields:
          - name: profile_name
            label: Display Name
            widget: string
          - name: profile_username
            label: Username
            widget: string
          - name: profile_bio
            label: Bio
            widget: text
          - name: profile_picture
            label: Profile Picture
            widget: image
            media_library:
              config:
                max_file_size: 5120000
                multiple: false
          - name: profile_github
            label: GitHub URL
            widget: string
          - name: profile_twitter
            label: Twitter/X URL
            widget: string
          - name: profile_linkedin
            label: LinkedIn URL
            widget: string
          - name: profile_email
            label: Email
            widget: string
          - name: profile_location
            label: Location
            widget: string
            required: false
          - name: profile_website
            label: Website
            widget: string
            required: false
      - name: homepage
        label: Home Page Settings
        file: src/content/settings/general.yml
        fields:
          - name: hero_tagline
            label: Hero Tagline
            widget: string
          - name: hero_title
            label: Hero Title
            widget: string
          - name: hero_button1_text
            label: Hero Button 1 Text
            widget: string
          - name: hero_button1_link
            label: Hero Button 1 Link
            widget: string
          - name: hero_button2_text
            label: Hero Button 2 Text
            widget: string
          - name: hero_button2_link
            label: Hero Button 2 Link
            widget: string
          - name: about_badge
            label: About Badge
            widget: string
          - name: about_title
            label: About Title
            widget: string
          - name: about_bio2
            label: About Bio (extra)
            widget: text
            required: false
          - name: about_button_text
            label: About Button Text
            widget: string
          - name: newsletter_title
            label: Newsletter Title
            widget: string
          - name: newsletter_description
            label: Newsletter Description
            widget: text
          - name: newsletter_button_text
            label: Newsletter Button Text
            widget: string
          - name: newsletter_readers
            label: Newsletter Readers Text
            widget: string
      - name: i18n
        label: Languages
        file: src/content/settings/i18n.yml
        fields:
          - name: default_locale
            label: Default Language
            widget: select
            options:
              - en
              - id
              - zh-CN
              - ru
          - name: locales
            label: Languages
            widget: list
            fields:
              - name: code
                label: Language Code
                widget: string
                hint: "e.g. en, id, zh-CN, ru"
              - name: name
                label: Language Name
                widget: string
                hint: "e.g. English, Bahasa Indonesia"
              - name: label
                label: Short Label
                widget: string
                hint: "e.g. EN, ID, 中文, RU"
              - name: enabled
                label: Enabled
                widget: boolean
                default: true
      - name: translations_en
        label: "Translations: English"
        file: src/i18n/en.json
        fields:
          - name: translations
            label: Translations (JSON)
            widget: code
            language: json
      - name: translations_id
        label: "Translations: Bahasa Indonesia"
        file: src/i18n/id.json
        fields:
          - name: translations
            label: Translations (JSON)
            widget: code
            language: json
      - name: translations_zhcn
        label: "Translations: 简体中文"
        file: src/i18n/zh-CN.json
        fields:
          - name: translations
            label: Translations (JSON)
            widget: code
            language: json
      - name: translations_ru
        label: "Translations: Русский"
        file: src/i18n/ru.json
        fields:
          - name: translations
            label: Translations (JSON)
            widget: code
            language: json
