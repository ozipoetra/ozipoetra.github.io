# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  base_url: https://sveltia-cms-auth.ozi.workers.dev
  repo: ozipoetra/astro-blog
  branch: main
  commit_messages:
    create: Create {{collection}} "{{slug}}"
    update: Update {{collection}} "{{slug}}"
    delete: Delete {{collection}} "{{slug}}"
    uploadMedia: Upload "{{path}}"
    deleteMedia: Delete "{{path}}"

media_folder: "/src/assets/media"
public_folder: "/assets/media"

media_libraries:
  all:
    max_file_size: 5120000

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: '-'
  trim: true
  lowercase: true

i18n:
  structure: multiple_folders
  locales: [en, id, zh-CN, ru]
  default_locale: en

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    icon: article
    folder: src/content/blog
    preview_path: "/{{locale}}/blog/{{slug}}"
    i18n: true
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: description
        label: Description
        widget: text
        i18n: true
      - name: pubDate
        label: Publish Date
        widget: datetime
        i18n: duplicate
      - name: updatedDate
        label: Updated Date
        widget: datetime
        i18n: duplicate
        required: false
      - name: heroImage
        label: Hero Image
        widget: image
        i18n: duplicate
        required: false
      - name: category
        label: Category
        widget: select
        i18n: duplicate
        required: false
        options:
          - tutorial
          - opinion
          - news
          - update
          - review
      - name: tags
        label: Tags
        widget: list
        i18n: duplicate
      - name: body
        label: Body
        widget: markdown
        i18n: true

  - name: projects
    label: Projects
    label_singular: Project
    icon: code
    folder: src/content/projects
    preview_path: "/{{locale}}/projects/{{slug}}"
    i18n: true
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: description
        label: Description
        widget: text
        i18n: true
      - name: icon
        label: Icon
        widget: string
        i18n: false
        default: "🚀"
      - name: technologies
        label: Technologies
        widget: list
        i18n: false
        allow_add: true
      - name: github
        label: GitHub URL
        widget: string
        i18n: false
        required: false
      - name: demo
        label: Demo URL
        widget: string
        i18n: false
        required: false
      - name: heroImage
        label: Hero Image
        widget: image
        i18n: false
        required: false
      - name: featured
        label: Featured
        widget: boolean
        i18n: false
        default: false
      - name: order
        label: Sort Order
        widget: number
        i18n: false
        default: 0
      - name: body
        label: Body
        widget: markdown
        i18n: true

  - name: pages
    label: Pages
    label_singular: Page
    icon: description
    folder: src/content/pages
    i18n: true
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: description
        label: Description
        widget: text
        i18n: true
      - name: layout
        label: Layout
        widget: select
        i18n: false
        options:
          - hero
          - content
          - sidebar
        default: content
      - name: heroImage
        label: Hero Image
        widget: image
        i18n: false
        required: false
      - name: body
        label: Body
        widget: markdown
        i18n: true

  - divider: true

  - name: settings
    label: Site Settings
    icon: settings
    files:
      - name: site
        label: Site
        file: src/content/settings/settings.yml
        fields:
          - name: site_title
            label: Site Title
            widget: string
          - name: site_tagline
            label: Site Tagline
            widget: string
          - name: site_description
            label: Site Description
            widget: text
      - name: navbar
        label: Navbar
        file: src/content/settings/settings.yml
        fields:
          - name: navbar_items
            label: Navigation Links
            widget: list
            fields:
              - name: key
                label: Translation Key
                widget: string
              - name: path
                label: Path
                widget: string
          - name: navbar_show_search
            label: Show Search
            widget: boolean
            default: true
          - name: navbar_show_contact
            label: Show Contact Button
            widget: boolean
            default: true
      - name: profile
        label: Profile
        file: src/content/settings/profile.yml
        fields:
          - name: profile_name
            label: Display Name
            widget: string
          - name: profile_username
            label: Username
            widget: string
          - name: profile_bio
            label: Bio
            widget: text
          - name: profile_picture
            label: Profile Picture
            widget: image
          - name: profile_github
            label: GitHub URL
            widget: string
          - name: profile_twitter
            label: Twitter/X URL
            widget: string
          - name: profile_linkedin
            label: LinkedIn URL
            widget: string
          - name: profile_email
            label: Email
            widget: string
          - name: profile_location
            label: Location
            widget: string
            required: false
          - name: profile_website
            label: Website
            widget: string
            required: false
      - name: i18n
        label: Languages
        file: src/content/settings/i18n.yml
        fields:
          - name: default_locale
            label: Default Language
            widget: select
            options:
              - en
              - id
              - zh-CN
              - ru
          - name: locales
            label: Languages
            widget: list
            allow_add: false
            fields:
              - name: code
                label: Language Code
                widget: string
              - name: name
                label: Language Name
                widget: string
              - name: label
                label: Short Label
                widget: string
              - name: enabled
                label: Enabled
                widget: boolean
                default: true
      - name: translations_en
        label: "English Translations"
        file: src/i18n/en.json
        format: json
        fields:
          - name: translations
            label: Translations
            widget: keyvalue
            root: true
            key_label: Key
            value_label: Value
      - name: translations_id
        label: "Bahasa Indonesia Translations"
        file: src/i18n/id.json
        format: json
        fields:
          - name: translations
            label: Translations
            widget: keyvalue
            root: true
            key_label: Key
            value_label: Value
      - name: translations_zhcn
        label: "简体中文 Translations"
        file: src/i18n/zh-CN.json
        format: json
        fields:
          - name: translations
            label: Translations
            widget: keyvalue
            root: true
            key_label: Key
            value_label: Value
      - name: translations_ru
        label: "Русский Translations"
        file: src/i18n/ru.json
        format: json
        fields:
          - name: translations
            label: Translations
            widget: keyvalue
            root: true
            key_label: Key
            value_label: Value
