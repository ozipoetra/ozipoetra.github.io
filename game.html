<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contra - Online Co-Op</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #6366f1;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%; max-width: 960px;
            padding: 24px 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        h1 { margin: 0; font-size: 1.4rem; }
        .tip {
            background: var(--card);
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 0.82rem;
            color: var(--muted);
            line-height: 1.7;
        }
        .tip strong { color: #38bdf8; }
        .game-wrapper {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 4 / 3;
            background: #000;
            touch-action: manipulation;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
        }
        #game-container { width: 100%; height: 100%; }
        @media (min-width: 768px) {
            body { padding-bottom: 40px; }
            .game-wrapper {
                border-radius: 16px;
                overflow: hidden;
                border: 1px solid rgba(255,255,255,0.06);
            }
        }
    </style>
</head>
<body>

<header>
    <h1>🕹️ Contra (Online Co-Op)</h1>
    <div class="tip">
        <strong>How to play online:</strong><br>
        1. Start the game &nbsp;→&nbsp;
        2. Click <strong>🌐</strong> in the emulator toolbar &nbsp;→&nbsp;
        3. Copy the room link &amp; send to your friend
    </div>
</header>

<div class="game-wrapper">
    <div id="game-container"></div>
</div>

</html>
