<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contra — Online Co-Op</title>
  <style>
    :root {
      --bg:      #0b0f1a;
      --surface: #151c2e;
      --border:  rgba(255,255,255,0.06);
      --accent:  #f5a623;
      --text:    #e8eaf0;
      --muted:   #6b7490;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ─────────────────────────────────────── */
    header {
      width: 100%;
      max-width: 960px;
      padding: 20px 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--accent);
      color: #000;
      padding: 2px 7px;
      border-radius: 4px;
    }

    /* ── Status pill ─────────────────────────────────── */
    #status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 0.8rem;
      color: var(--muted);
      transition: color 0.3s;
    }

    #status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
      flex-shrink: 0;
    }

    #status-bar.ready   { color: var(--text); }
    #status-bar.ready   #status-dot { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
    #status-bar.error   { color: #f87171; }
    #status-bar.error   #status-dot { background: #f87171; }
    #status-bar.loading #status-dot { background: var(--accent); animation: pulse 1s infinite; }

    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    /* ── Game wrapper ────────────────────────────────── */
    .game-wrapper {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 4 / 3;
      background: #000;
      position: relative;
      touch-action: manipulation;
      box-shadow: 0 30px 60px -10px rgba(0,0,0,0.7);
    }

    #game-container { width: 100%; height: 100%; }

    /* Loading overlay shown while fetching TURN credentials */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10;
    }

    #loading-overlay .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(245,166,35,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-overlay p {
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* ── How-to tip ──────────────────────────────────── */
    .tip {
      width: 100%;
      max-width: 960px;
      padding: 10px 16px;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.7;
    }

    .tip strong { color: var(--accent); }

    @media (min-width: 768px) {
      body { padding-bottom: 40px; }
      header { padding: 28px 10px 16px; }
      .game-wrapper {
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>

<header>
  <div class="title">
    <h1>🕹️ Contra</h1>
    <span class="badge">Online Co-Op</span>
  </div>

  <div id="status-bar" class="loading">
    <span id="status-dot"></span>
    <span id="status-text">Fetching TURN credentials…</span>
  </div>
</header>

<div class="game-wrapper">
  <!-- Shown while TURN credentials are loading -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <p>Setting up secure connection…</p>
  </div>

  <div id="game-container"></div>
</div>

<div class="tip">
  <strong>To play online:</strong>
  Start the game → click <strong>🌐</strong> in the emulator toolbar → copy the room link → send it to your friend.
  Your friend joins as a spectator; you then assign them <strong>Player 2</strong> in the netplay menu.
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CONFIG — update these two lines only
// ─────────────────────────────────────────────────────────────────────────────

// Your Cloudflare Worker URL (from turn-worker.js deployment)
const TURN_WORKER_URL = 'https://turn-server.ozi.workers.dev';

// Your EmulatorJS netplay server (your Rust server via Cloudflare Tunnel)
const NETPLAY_SERVER  = 'https://game.ozip.qzz.io';

// ─────────────────────────────────────────────────────────────────────────────

const statusBar  = document.getElementById('status-bar');
const statusText = document.getElementById('status-text');
const overlay    = document.getElementById('loading-overlay');

function setStatus(state, text) {
  statusBar.className = state;
  statusText.textContent = text;
}

// Step 1: Fetch fresh Cloudflare TURN credentials
fetch(TURN_WORKER_URL)
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(iceServers => {
    if (!Array.isArray(iceServers) || iceServers.length === 0) {
      throw new Error('Empty ICE server list returned');
    }

    setStatus('ready', 'Connected — TURN ready');

    // Step 2: Set EmulatorJS globals BEFORE loading loader.js
    window.EJS_player        = '#game-container';
    window.EJS_core          = 'nes';
    window.EJS_gameUrl       = 'https://huggingface.co/buckets/ozipoetra/Tedt/resolve/Contra%20(U).nes?download=true';
    window.EJS_pathtodata    = 'https://cdn.emulatorjs.org/nightly/data/';
    window.EJS_gameID        = 1001;   // Must be a unique number per game
    window.EJS_startOnLoaded = false;  // Show splash so audio context unlocks cleanly
    window.EJS_netplayServer = NETPLAY_SERVER;
    window.EJS_netplayICEServers = iceServers;

    // Step 3: Remove the loading overlay
    overlay.remove();

    // Step 4: Dynamically inject loader.js NOW (after globals are set)
    const script = document.createElement('script');
    script.src = 'https://cdn.emulatorjs.org/nightly/data/loader.js';
    document.body.appendChild(script);

    // Step 5: Fix for guest black screen — browser autoplay policy blocks
    // the WebRTC video stream. We watch for the <video> element EmulatorJS
    // injects and force-play it on the first user gesture.
    installVideoFix();
  })
  .catch(err => {
    console.error('[TURN] Failed to fetch credentials:', err);
    setStatus('error', 'TURN fetch failed — check worker URL');
    overlay.innerHTML = `
      <p style="color:#f87171;font-size:0.85rem;padding:20px;text-align:center;">
        ⚠️ Could not load TURN credentials.<br>
        Check the browser console and verify your Worker URL.
      </p>`;
  });

// ─────────────────────────────────────────────────────────────────────────────
// Guest black screen fix
// EmulatorJS receives the WebRTC video stream into a <video srcObject=...>
// element but browsers block autoplay on it. We detect it and call .play().
// ─────────────────────────────────────────────────────────────────────────────
function installVideoFix() {
  let fixed = false;

  function tryPlay() {
    if (fixed) return;
    document.querySelectorAll('video').forEach(v => {
      if (v.srcObject && v.paused) {
        v.play()
          .then(() => {
            console.log('[Netplay] Remote video stream started ✓');
            fixed = true;
          })
          .catch(e => console.warn('[Netplay] play() blocked:', e));
      }
    });
  }

  // Poll every 500ms — the <video> element appears after WebRTC negotiation
  const poll = setInterval(() => {
    tryPlay();
    if (fixed) clearInterval(poll);
  }, 500);

  // Also hook every user gesture as a safety net
  ['click', 'keydown', 'touchstart'].forEach(evt => {
    document.addEventListener(evt, tryPlay);
  });
}
</script>

</body>
</html>
