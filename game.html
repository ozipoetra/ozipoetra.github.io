<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contra Arcade - Online Co-Op</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            max-width: 960px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        h1 { margin: 0; font-size: 1.5rem; font-weight: 700; }
        .info-card {
            background: var(--card-bg);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .info-card span { color: #38bdf8; font-weight: 600; }
        .game-wrapper {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 4 / 3;
            background: #000;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            touch-action: manipulation;
        }
        #game-container { width: 100%; height: 100%; }
        @media (min-width: 768px) {
            body { padding-bottom: 40px; }
            header { padding: 30px 10px 20px 10px; }
            .game-wrapper {
                border-radius: 16px;
                overflow: hidden;
                border: 1px solid rgba(255,255,255,0.05);
            }
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>Contra (Online Co-Op)</h1>
    </div>
    <div class="info-card">
        To play online: Start game → click <span>🌐</span> in menu → share the room link with your friend
    </div>
</header>

<div class="game-wrapper">
    <div id="game-container"></div>
</div>

<script>
    // ── EmulatorJS Core Config ─────────────────────────────────────────────
    window.EJS_player      = '#game-container';
    window.EJS_core        = 'nes';
    window.EJS_gameUrl     = 'https://huggingface.co/buckets/ozipoetra/Tedt/resolve/Contra%20(U).nes?download=true';
    window.EJS_pathtodata  = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_gameID      = 1001; // Unique ID required for netplay room matching
    window.EJS_startOnLoaded = false;

    // ── Netplay Config ─────────────────────────────────────────────────────
    // IMPORTANT: Replace the URL below with your own self-hosted netplay server.
    // Clone and run: https://github.com/EmulatorJS/EmulatorJS-Netplay
    window.EJS_netplayServer = 'https://YOUR_SERVER_IP:3000';

    // Free STUN + TURN servers for WebRTC hole-punching
    window.EJS_netplayICEServers = [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun.nextcloud.com:3478' },
        { urls: 'turn:openrelay.metered.ca:80',  username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
    ];
</script>

<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
